# @spec DELIVERY-CI-001, DELIVERY-CI-002, DELIVERY-CI-009
name: GHCR retention

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC

permissions: {}

jobs:
  prune:
    permissions:
      packages: write
    uses: chainringlabs/ci/.github/workflows/ghcr-retention.yml@9f6bdfe7ee10489a9dd82ac1c566ddaac8cd61e6 # v1.4.0
    with:
      # Release versions (X.Y.Z) are never pruned; sha- builds of main are.
      exclude-tags: 'latest,*.*.*'
