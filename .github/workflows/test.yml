# @spec DELIVERY-CI-001, DELIVERY-CI-003, DELIVERY-CI-004, DELIVERY-CI-011
name: Test

on:
  pull_request:

permissions: {}

jobs:
  python:
    name: Python version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read requires-python
        id: read
        run: echo "version=$(python3 scripts/python_version.py)" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        env:
          PYTHON_VERSION: ${{ needs.python.outputs.version }}
        run: uv python install "$PYTHON_VERSION"
      - name: Lock is current
        run: uv lock --check
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --no-cache
      - name: Format
        run: uv run ruff format --check --no-cache
      - name: Size limits
        run: uv run python scripts/check_sizes.py
      - name: Spec citations
        run: uv run python scripts/check_specs.py
      - name: Tests
        run: uv run pytest --cov=wearstream --cov-report=term-missing --cov-fail-under=90

  image:
    name: Image
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: wearstream:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          PYTHON_VERSION: ${{ needs.python.outputs.version }}
        run: |
          set -euo pipefail
          run() { docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges "$@"; }
          run wearstream:test version
          actual=$(run --entrypoint python wearstream:test -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "image Python $actual, requires-python $PYTHON_VERSION"
          test "$actual" = "$PYTHON_VERSION"

          # Three empty mounts owned by the image's uid, both sources on, no credentials.
          mounts=$(mktemp -d)
          mkdir "$mounts/data" "$mounts/state" "$mounts/secrets"
          sudo chown 65532:65532 "$mounts/data" "$mounts/state" "$mounts/secrets"
          opts=(-v "$mounts/data:/data" -v "$mounts/state:/state" -v "$mounts/secrets:/secrets"
                -e WEARSTREAM_SOURCES=whoop,garmin -e WEARSTREAM_LOG_FORMAT=json)

          # Before the daemon has run, the health check fails for want of a heartbeat.
          set +e
          out=$(run "${opts[@]}" wearstream:test healthcheck)
          status=$?
          set -e
          echo "$out"
          test "$status" -eq 1
          grep -q "no readable heartbeat" <<<"$out"

          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges "${opts[@]}" wearstream:test
          trap 'docker logs smoke 2>&1 | tail -n 40; docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 60); do
            grep -q '"event": "daemon_started"' <<<"$(docker logs smoke 2>&1)" && break
            sleep 1
          done
          grep -q '"event": "daemon_started"' <<<"$(docker logs smoke 2>&1)"

          # Without credentials, both sources end up waiting_for_auth, with no network call.
          states=""
          for _ in $(seq 120); do
            states=$(docker exec smoke wearstream status --json | python3 -c \
              'import json, sys; s = json.load(sys.stdin)["sources"]; print(s["whoop"]["state"], s["garmin"]["state"])' || true)
            [ "$states" = "waiting_for_auth waiting_for_auth" ] && break
            sleep 1
          done
          echo "source states: $states"
          test "$states" = "waiting_for_auth waiting_for_auth"
          docker exec smoke wearstream healthcheck

          docker stop -t 60 smoke
          test "$(docker inspect smoke --format '{{.State.ExitCode}}')" = 0
