# @spec DELIVERY-CI-001, DELIVERY-CI-003, DELIVERY-CI-004, DELIVERY-CI-011
name: Test

on:
  pull_request:

permissions: {}

jobs:
  python:
    name: Python version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read requires-python
        id: read
        run: echo "version=$(python3 scripts/python_version.py)" >> "$GITHUB_OUTPUT"

  check:
    name: Check
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Python
        env:
          PYTHON_VERSION: ${{ needs.python.outputs.version }}
        run: uv python install "$PYTHON_VERSION"
      - name: Lock is current
        run: uv lock --check
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check --no-cache
      - name: Format
        run: uv run ruff format --check --no-cache
      - name: Size limits
        run: uv run python scripts/check_sizes.py
      - name: Spec citations
        run: uv run python scripts/check_specs.py
      - name: Tests
        run: uv run pytest --cov=wearstream --cov-report=term-missing --cov-fail-under=90

  image:
    name: Image
    needs: python
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: wearstream:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        env:
          PYTHON_VERSION: ${{ needs.python.outputs.version }}
        run: |
          set -euo pipefail
          run() { docker run --rm --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges "$@"; }
          run wearstream:test version
          actual=$(run --entrypoint python wearstream:test -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          echo "image Python $actual, requires-python $PYTHON_VERSION"
          test "$actual" = "$PYTHON_VERSION"
