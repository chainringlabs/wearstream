[project]
name = "wearstream"
version = "0.1.0.dev0"
description = "Self-hosted capture of your raw Whoop and Garmin Connect data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "structlog>=26.1.0",
]

[project.scripts]
wearstream = "wearstream.cli:entry"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pyyaml",
    "ruff",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Supply chain: resolve nothing published to PyPI in the last 7 days, the cooldown the shared
# Renovate preset applies to uv projects. garminconnect is exempt: when Garmin changes its
# sign-in, the library fix must reach a release in days (its updates are merged by hand).
exclude-newer = "7 days"
exclude-newer-package = { garminconnect = false }

[tool.ruff]
target-version = "py315"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
